name: CI

on:
  push:
    branches: [main, "step/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: safetradev2
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: safetradev2
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U safetradev2" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      SAFETRADE_TEST_REDIS_URL: redis://127.0.0.1:6379/9
      SAFETRADE_TEST_DATABASE_URL: postgresql+psycopg://safetradev2:ci-only@127.0.0.1:5432/safetradev2_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:messages
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp infra/.env.example infra/.env
      - run: echo "SAFETRADE_ENCRYPTION_KEY=$(python3 -c 'import base64,os;print(base64.b64encode(os.urandom(32)).decode())')" >> infra/.env
      - run: docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build --wait
      - run: curl --fail --silent http://127.0.0.1:18000/health
      - run: curl --fail --silent --output /dev/null http://127.0.0.1:13000/
      - if: always()
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env down -v
