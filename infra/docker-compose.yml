# SafeTrade V2 : infrastructure isolée. Tous les noms (projet, conteneurs, images,
# réseau, volumes) commencent par « safetradev2 » pour ne jamais toucher aux autres
# projets Docker de la machine (MUYUEXCHANGE, MUYUSTORE, ancien SafeTrade...).
#
# Depuis la racine :
#   cp infra/.env.example infra/.env
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build --wait
name: safetradev2

services:
  postgres:
    image: postgres:16-alpine
    container_name: safetradev2-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:?}:5432"
    networks: [safetradev2]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: safetradev2-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:?}:6379"
    networks: [safetradev2]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../backend
    image: safetradev2-backend:dev
    container_name: safetradev2-backend
    environment:
      SAFETRADE_ENVIRONMENT: development
      SAFETRADE_REAL_ACCOUNT_ENABLED: "false"
      # Communications internes : ports standard des services.
      SAFETRADE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SAFETRADE_REDIS_URL: redis://redis:6379/0
      SAFETRADE_ENCRYPTION_KEY: ${SAFETRADE_ENCRYPTION_KEY:?générer la clé, voir infra/.env.example}
      # Développement local en HTTP uniquement : cookie de session sans l'attribut Secure.
      SAFETRADE_SESSION_COOKIE_SECURE: "false"
      SAFETRADE_PUBLIC_APP_URL: http://127.0.0.1:${WEB_HOST_PORT}
      SAFETRADE_ALLOWED_ORIGINS: '["http://127.0.0.1:${WEB_HOST_PORT}","http://localhost:${WEB_HOST_PORT}","http://localhost:13001"]'
      # Adresse IP réelle du visiteur transmise par X-Forwarded-For via la réécriture /api
      # du front-end. Développement : réseau Docker interne ; en production, limiter à
      # l'adresse du reverse proxy.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:${API_HOST_PORT:?}:8000"
    networks: [safetradev2]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        API_INTERNAL_URL: http://backend:8000
    image: safetradev2-frontend:dev
    container_name: safetradev2-frontend
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:?}:3000"
    networks: [safetradev2]
    depends_on:
      backend:
        condition: service_healthy

networks:
  safetradev2:
    name: safetradev2-network

volumes:
  postgres-data:
    name: safetradev2-postgres-data
  redis-data:
    name: safetradev2-redis-data
