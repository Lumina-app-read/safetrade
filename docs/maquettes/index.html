<!doctype html>
<html lang="fr" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeTrade — Maquettes</title>
<script>
  // Thème appliqué avant le premier rendu : aucun flash.

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Jetons de design : identité rouge et anthracite (docs/decisions/q13-identite-visuelle.md).
   Rouge #D6041D et anthracite #202329 mesurés sur le logo (hypothèse, pas de charte officielle). */
:root {
  --accent: #D6041D; --accent-hover: #B80318; --accent-soft: #FDE8EA; --accent-soft-text: #B80318;
  --on-accent: #FFFFFF;
  --anthracite: #202329; --on-anthracite: #FFFFFF;
  --page: #F5F6F7; --card: #FFFFFF; --border: #E4E6E9;
  --text: #15191C; --muted: #5C636E;
  --gain: #16A34A; --gain-text: #15803D; --gain-soft: #DCFCE7;
  --loss: #B91C1C; --loss-text: #B91C1C; --loss-soft: #FEE2E2;
  --warn: #D97706; --warn-text: #B45309; --warn-soft: #FEF3C7;
  --primary: #202329; --on-primary: #FFFFFF;
  --banner-ring: rgba(214,4,29,.35);
  --shadow: 0 1px 2px rgba(15,23,42,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent: #D6041D; --accent-hover: #B80318; --accent-soft: #3A1418; --accent-soft-text: #FF5A69;
    --on-accent: #FFFFFF;
    --anthracite: #202329; --on-anthracite: #FFFFFF;
    --page: #111316; --card: #1A1D21; --border: #2A2F36;
    --text: #ECEEF1; --muted: #9AA1AC;
    --gain: #34D399; --gain-text: #34D399; --gain-soft: #0F2E26;
    --loss: #F87171; --loss-text: #F87171; --loss-soft: #3A1A1F;
    --warn: #FBBF24; --warn-text: #FBBF24; --warn-soft: #33270C;
    --primary: #ECEEF1; --on-primary: #15191C;
    --banner-ring: rgba(214,4,29,.35);
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --accent: #D6041D; --accent-hover: #B80318; --accent-soft: #3A1418; --accent-soft-text: #FF5A69;
  --on-accent: #FFFFFF;
  --anthracite: #202329; --on-anthracite: #FFFFFF;
  --page: #111316; --card: #1A1D21; --border: #2A2F36;
  --text: #ECEEF1; --muted: #9AA1AC;
  --gain: #34D399; --gain-text: #34D399; --gain-soft: #0F2E26;
  --loss: #F87171; --loss-text: #F87171; --loss-soft: #3A1A1F;
  --warn: #FBBF24; --warn-text: #FBBF24; --warn-soft: #33270C;
  --primary: #ECEEF1; --on-primary: #15191C;
  --banner-ring: rgba(214,4,29,.35);
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--text); font: 400 14px/1.5 "Plus Jakarta Sans", system-ui, sans-serif; }
button, select, input { font: inherit; color: inherit; }
h1 { font-size: 28px; font-weight: 400; margin: 0; line-height: 1.25; }
h2 { font-size: 22px; font-weight: 400; margin: 0; }
h3 { font-size: 18px; font-weight: 500; margin: 0; }
.small { font-size: 12px; color: var(--muted); }
.label { font-size: 13px; font-weight: 500; }
.kpi { font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; }
.section-title { font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 32px 0 12px; }
svg.i { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
table svg.i, .pill svg.i { width: 16px; height: 16px; }

/* Barre supérieure */
.topbar { position: sticky; top: 0; z-index: 10; background: var(--card); border-bottom: 1px solid var(--border); }
.topbar-in { max-width: 1200px; margin: 0 auto; height: 64px; padding: 0 24px; display: flex; align-items: center; gap: 16px; }
.logo { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 500; }
.logo-mark { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.nav { display: flex; gap: 4px; margin: 0 auto; }
.nav button { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500; }
.nav button:hover { color: var(--text); background: var(--page); }
.nav button[aria-current="page"] { color: var(--accent-soft-text); background: var(--accent-soft); }
.tools { display: flex; align-items: center; gap: 8px; }
.seg { display: flex; border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; color: var(--muted); display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-soft-text); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-soft-text); display: grid; place-items: center; font-size: 13px; font-weight: 500; }
.burger { display: none; border: 0; background: none; padding: 8px; cursor: pointer; }

/* Pastilles */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.gain { background: var(--gain-soft); color: var(--gain-text); }
.pill.loss { background: var(--loss-soft); color: var(--loss-text); }
.pill.warn { background: var(--warn-soft); color: var(--warn-text); }
/* États neutres (bot en analyse, position ouverte) : jamais en rouge, pour ne pas se lire comme une perte. */
.pill.info { background: var(--card); color: var(--text); border: 1px solid var(--border); }
.pill.neutral { background: var(--page); color: var(--muted); border: 1px solid var(--border); }
.mode-demo { background: var(--warn-soft); color: var(--warn-text); border: 1px solid var(--warn); }

/* Mise en page */
main { max-width: 1200px; margin: 0 auto; padding: 32px 24px 96px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: var(--shadow); }
.grid { display: grid; gap: 16px; }
.grid > *, .hero > *, .trade > * { min-width: 0; }
.g2 { grid-template-columns: repeat(2, 1fr); }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g4 { grid-template-columns: repeat(4, 1fr); }
.hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-accent { background: var(--accent); color: var(--on-accent); }
.btn-accent:hover { background: var(--accent-hover); }
.btn-ghost { background: var(--card); border-color: var(--border); }
.btn-danger { background: var(--card); border-color: var(--loss); color: var(--loss-text); }
.btn[disabled] { opacity: .55; cursor: progress; }

.banner { position: relative; overflow: hidden; border-radius: 12px; background: var(--anthracite); color: var(--on-anthracite); border: 1px solid var(--border); padding: 32px; min-height: 240px; display: flex; flex-direction: column; justify-content: space-between; }
.banner::before, .banner::after { content: ""; position: absolute; border-radius: 50%; border: 40px solid var(--banner-ring); }
.banner::before { width: 320px; height: 320px; right: -100px; top: -120px; }
.banner::after { width: 200px; height: 200px; right: 80px; bottom: -130px; }
.banner > * { position: relative; }
.banner .muted-on { opacity: .85; font-size: 13px; }
.stat { display: flex; flex-direction: column; gap: 8px; }
.stat-top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); }
.up { color: var(--gain-text); } .down { color: var(--loss-text); }
.shortcut { display: flex; gap: 16px; align-items: center; }
.ico-box { width: 40px; height: 40px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-soft-text); display: grid; place-items: center; flex: none; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 0 12px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 14px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; margin: 0 -12px; }
.icon-btn { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 6px; }
.icon-btn:hover { color: var(--text); background: var(--page); }

.risk { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 8px; border: 1px solid var(--warn); background: var(--warn-soft); color: var(--text); font-size: 13px; margin-top: 24px; }
.risk svg { color: var(--warn-text); }
.fab { position: fixed; right: 24px; bottom: 24px; width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; cursor: pointer; box-shadow: 0 4px 12px rgba(15,23,42,.18); }

/* Trading */
.modebar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.trade { display: grid; grid-template-columns: 1fr 340px; gap: 16px; }
.chart-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.field-row { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; background: var(--page); }
.field-row input, .field-row select, select.inp { border: 0; background: none; padding: 9px 12px; width: 100%; outline: none; }
select.inp { border: 1px solid var(--border); border-radius: 8px; background: var(--card); width: auto; }
.field-row span { padding: 0 12px; color: var(--muted); font-size: 12px; white-space: nowrap; }
.field-row:focus-within { border-color: var(--accent); }
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.controls .btn-accent, .controls .btn-danger { grid-column: 1 / -1; }
.status-line { font-size: 12px; color: var(--muted); min-height: 18px; margin-top: 8px; }
.log li { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.log li:last-child { border-bottom: 0; }
.log ul { list-style: none; margin: 0; padding: 0; }
.log time { color: var(--muted); font-size: 12px; min-width: 64px; font-variant-numeric: tabular-nums; }

/* Abonnement */
.plan { display: flex; flex-direction: column; gap: 16px; }
.plan.featured { border-color: var(--accent); }
.price { font-size: 28px; font-weight: 500; }
.pay { display: flex; gap: 12px; align-items: center; padding: 16px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
.pay[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }

/* Mobile */
@media (max-width: 960px) {
  .nav { display: none; position: absolute; top: 64px; left: 0; right: 0; background: var(--card); border-bottom: 1px solid var(--border); flex-direction: column; padding: 8px 16px 16px; }
  .nav.open { display: flex; }
  .burger { display: block; }
  .tools { margin-left: auto; }
  .hero, .trade, .g3, .g4 { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .topbar-in, main { padding-left: 16px; padding-right: 16px; }
  .g2 { grid-template-columns: 1fr; }
  .logo span { display: none; }
  .seg button { padding: 4px 6px; }
  .banner { padding: 24px; }
  .page-head .btn { width: 100%; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <button class="burger" id="burger" data-i18n-aria="menu"></button>
    <div class="logo"><div class="logo-mark" data-icon="shield"></div><span>SafeTrade</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="tools">
      <div class="seg" id="themeSeg"></div>
      <div class="seg" id="langSeg"></div>
      <div class="avatar">CM</div>
    </div>
  </div>
</header>
<main id="app"></main>
<button class="fab" data-icon="life-buoy" data-i18n-aria="help"></button>

function chart() {
  let v = 50, seed = 7; const pts = [];
  for (let i = 0; i < 120; i++) { seed = (seed * 9301 + 49297) % 233280; v += (seed / 233280 - 0.48) * 4; pts.push(v); }
  const min = Math.min(...pts), max = Math.max(...pts), W = 800, H = 280;
  const xy = pts.map((p, i) => `${(i / (pts.length - 1) * W).toFixed(1)},${(H - 16 - (p - min) / (max - min) * (H - 32)).toFixed(1)}`);
  const grid = [0.25, 0.5, 0.75].map(f => `<line x1="0" x2="${W}" y1="${H * f}" y2="${H * f}" stroke="var(--border)" stroke-dasharray="4 4"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="280" preserveAspectRatio="none" role="img" aria-label="Volatility 75 Index">
    <defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--text)" stop-opacity=".10"/><stop offset="1" stop-color="var(--text)" stop-opacity="0"/></linearGradient></defs>
    ${grid}<polygon points="0,${H} ${xy.join(' ')} ${W},${H}" fill="url(#fill)"/>
    <polyline points="${xy.join(' ')}" fill="none" stroke="var(--text)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-theme-set],[data-lang],[data-pay],[data-act],#burger');
  if (!el) return;
  if (el.id === 'burger') return document.getElementById('nav').classList.toggle('open');
  if (el.dataset.go) { state.screen = el.dataset.go; document.getElementById('nav').classList.remove('open'); window.scrollTo(0, 0); }
  if (el.dataset.themeSet) { document.documentElement.dataset.theme = el.dataset.themeSet; try { localStorage.setItem('st-theme', el.dataset.themeSet); } catch (x) {} }
  if (el.dataset.lang) { state.lang = el.dataset.lang; try { localStorage.setItem('st-lang', state.lang); } catch (x) {} }
  if (el.dataset.pay) state.pay = el.dataset.pay;
  if (el.hasAttribute('data-act')) {
    // Comportement attendu : état d'attente jusqu'à la réponse du backend, jamais de succès simulé.

    setTimeout(() => { el.disabled = false; s.textContent = t('mock_note'); }, 1200);
    return;
  }
  render();
});
